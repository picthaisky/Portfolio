<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cube1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cube2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="cube3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#bg1)"/>
  <!-- Isometric Grid Lines -->
  <g opacity="0.08" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="160" x2="800" y2="60"/><line x1="0" y1="200" x2="800" y2="100"/>
    <line x1="0" y1="240" x2="800" y2="140"/><line x1="0" y1="280" x2="800" y2="180"/>
    <line x1="0" y1="60" x2="800" y2="160"/><line x1="0" y1="100" x2="800" y2="200"/>
    <line x1="0" y1="140" x2="800" y2="240"/><line x1="0" y1="180" x2="800" y2="280"/>
  </g>
  <!-- Isometric Cube Left -->
  <g transform="translate(80,180)">
    <polygon points="0,0 50,-25 100,0 50,25" fill="url(#cube3)" opacity="0.7"/>
    <polygon points="0,0 0,50 50,75 50,25" fill="url(#cube1)" opacity="0.7"/>
    <polygon points="50,25 50,75 100,50 100,0" fill="url(#cube2)" opacity="0.7"/>
  </g>
  <!-- Isometric Cube Right -->
  <g transform="translate(620,200)">
    <polygon points="0,0 50,-25 100,0 50,25" fill="url(#cube3)" opacity="0.7"/>
    <polygon points="0,0 0,50 50,75 50,25" fill="url(#cube1)" opacity="0.7"/>
    <polygon points="50,25 50,75 100,50 100,0" fill="url(#cube2)" opacity="0.7"/>
  </g>
  <!-- Small cubes -->
  <g transform="translate(160,230)" opacity="0.5">
    <polygon points="0,0 25,-12 50,0 25,12" fill="url(#cube3)"/>
    <polygon points="0,0 0,25 25,37 25,12" fill="url(#cube1)"/>
    <polygon points="25,12 25,37 50,25 50,0" fill="url(#cube2)"/>
  </g>
  <g transform="translate(580,150)" opacity="0.4">
    <polygon points="0,0 20,-10 40,0 20,10" fill="url(#cube3)"/>
    <polygon points="0,0 0,20 20,30 20,10" fill="url(#cube1)"/>
    <polygon points="20,10 20,30 40,20 40,0" fill="url(#cube2)"/>
  </g>
  <!-- Title -->
  <text x="400" y="110" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,sans-serif" font-size="42" font-weight="bold" filter="url(#glow)">Supachai Nilcha</text>
  <text x="400" y="150" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,sans-serif" font-size="18">Software Engineer · Full Stack Developer · DevOps Engineer</text>
  <text x="400" y="185" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI,sans-serif" font-size="14" opacity="0.8">10+ Years Experience in Software Development and IT Management</text>
  <!-- Badges -->
  <g transform="translate(240,210)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e40af" opacity="0.8"/>
    <text x="50" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="Segoe UI,sans-serif">.NET Core</text>
  </g>
  <g transform="translate(120,210)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e40af" opacity="0.8"/>
    <text x="50" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="Segoe UI,sans-serif">Angular</text>
  </g>
  <g transform="translate(360,210)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e40af" opacity="0.8"/>
    <text x="50" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="Segoe UI,sans-serif">Docker</text>
  </g>
  <g transform="translate(480,210)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#1e40af" opacity="0.8"/>
    <text x="50" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="Segoe UI,sans-serif">React</text>
  </g>
</svg>
